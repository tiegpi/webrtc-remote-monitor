<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>远程监视</title>
<style>
  :root {
    --bg:#14161a; --panel:#1e2128; --line:#2e3340;
    --fg:#e6e8ee; --dim:#9aa3b2; --ok:#3ddc84; --warn:#ffb020; --err:#ff5c5c;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:16px; background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  h1 { font-size:17px; margin:0 0 12px; font-weight:600; }
  .bar {
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:10px 12px; margin-bottom:12px;
  }
  .status { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
  .status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.err{color:var(--err)}
  button {
    background:#2b3140; color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:6px 14px; font:inherit; cursor:pointer;
  }
  button:hover:not(:disabled){ background:#39415380; }
  button:disabled{ opacity:.45; cursor:default; }
  button.on{ background:#1f4d33; border-color:var(--ok); color:var(--ok); }
  #talkHint { color:var(--dim); font-size:12px; }
  /* 摄像头分段按钮。用现成的 button + .on 激活态，不引 select —— 两个选项
     时按钮更直观，而且 .on 那套已经在「开始对讲」上用着了，样式是白拿的。 */
  .cams { display:flex; gap:6px; align-items:center; }
  .cams::before {
    content:"摄像头"; color:var(--dim); font-size:12px; margin-right:2px;
  }
  .cams:empty { display:none; }
  .stage { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:12px; }
  @media (max-width:900px){ .stage{grid-template-columns:1fr} }
  video {
    width:100%; aspect-ratio:16/9; background:#000; display:block;
    border:1px solid var(--line); border-radius:8px;
  }
  .side { display:flex; flex-direction:column; gap:8px; min-width:0; }
  pre {
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; margin:0; color:var(--dim); overflow:auto;
    font:12px/1.6 ui-monospace,"Cascadia Mono",Consolas,monospace; white-space:pre-wrap;
  }
  #stats { min-height:150px; }
  #ice { flex:1; max-height:300px; white-space:pre; }
  #log { height:150px; margin-top:12px; word-break:break-all; }
</style>
</head>
<body>

<h1>远程监视</h1>

<div class="bar">
  <span id="roomLabel">房间 —</span>
  <button id="talkBtn">开始对讲</button>
  <span id="talkHint">点了之后浏览器才会申请麦克风</span>
  <!-- 摄像头按钮由 loadCameras() 按板子给的清单生成（GET /camera）。
       清单为空时 .cams:empty 会整块隐藏，不留一个空标签。 -->
  <span class="cams" id="cams"></span>
  <span id="status" class="status">未连接</span>
</div>

<div class="stage">
  <!-- muted 一开始**必须留着**：浏览器的自动播放策略要求"带声音的播放"
       得有用户手势。没有它，页面一打开视频就被拒绝播放，表现是全黑 ——
       而原因和媒体链路毫无关系。点「开始对讲」时那个手势同时用来解除静音。
       （另一个坑：就是 muted 让阶段一的"听不见板子"看起来像 bug，其实不是。） -->
  <video id="video" autoplay playsinline muted></video>
  <div class="side">
    <pre id="stats">等待发布端…</pre>
    <pre id="ice">连接后自动显示 ICE 详情。</pre>
  </div>
</div>

<pre id="log"></pre>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const video = $("video"), logEl = $("log"), statsEl = $("stats");
const statusEl = $("status"), iceEl = $("ice");

// 房间号：URL 上的 ?room= 优先，没给就问板子要（见 resolveRoom）。
// **不能在这里写死默认值** —— 信令服务器只认它配置的那一个房间，页面写死的值
// 一旦和板子 device_agent 的 --room 对不上，服务器会回 bad-room 然后直接关连接：
// 表现是"打开页面什么都没发生"，板子日志干干净净，浏览器这边也只有一句已断开。
let room = new URLSearchParams(location.search).get("room") || null;
$("roomLabel").textContent = room ? "房间 " + room : "房间 …";

let pc = null, ws = null, statsTimer = null, diagTimer = null;
let prevSample = null;        // 上一次采样，用来算码率/帧率的增量
let iceServers = [];          // 从 /ice.json 拿到的 STUN/TURN 配置
// 页面版本号，跟着每一份 diag 样本上报。
// 加这个是因为踩过一次：改了页面、让用户刷新，用户也以为刷了，但拿回来的
// 样本里新字段是空的 —— 分不清是"用户没刷"、"浏览器吃了缓存"还是"我字段名
// 写错了"。有了版本号，样本自己就说得出跑的是哪版 JS，不用再靠 md5 猜。
// 每次改这个文件都要动这里。
const PAGE_VERSION = "2026-10-14.5";

let lastStats = null;         // 最近一次完整样本，供 diag 上报
const pendingCandidates = []; // setRemoteDescription 之前到达的候选先缓存

// 摄像头切换（板子上接了两个，一次只推一路）。
// 页面**不创建、不重建、不碰 PeerConnection** —— 切换发生在板子的管线内部，
// 编码输出是同一份 caps，所以既没有新 offer，ontrack 也不会再触发，
// video.srcObject 一直有效。这里要做的只有按钮高亮和把错误打出来。
let cams = [];                // 板子给的清单，含 present
let currentCam = null;        // 当前这一路（板子说了算，不是页面自己记的）
let camBusy = false;          // 串行化，防连点

// 浏览器的麦克风。**必须在 setRemoteDescription 之前**加进 pc —— 见 startTalk
// 和 createPc 里的说明，这是阶段二最容易踩的一个顺序问题。
let micStream = null;

/* ---------------------------------------------------------------- 工具 */
function log(msg) {
  const t = new Date().toLocaleTimeString("zh-CN", { hour12:false });
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = "status" + (kind ? " " + kind : "");
}
function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

/* -------------------------------------------------------------- 房间号 */
/* 板子的 web_server 在 /config.json 里给出它服务的房间号。问它要，而不是写死：
   板子上的 device_agent 按自己的 --room 发布，两边必须一致，而唯一知道这个值的
   就是板子自己。问不到就退回 "demo" 并**大声说出来** —— 静默用一个大概率错的
   房间号，只会把问题推到信令服务器那边去。 */
async function resolveRoom() {
  if (room) { log(`房间号取自 URL：${room}`); return room; }
  try {
    const r = await fetch("./config.json", { cache: "no-store" });
    if (r.ok) {
      const cfg = await r.json();
      if (cfg.room) { room = cfg.room; log(`板子告诉页面房间号：${room}`); }
    }
  } catch (e) {
    log("取 /config.json 失败（" + e.message + "）");
  }
  if (!room) {
    room = "demo";
    log("!! 板子没给出房间号，退回写死的 \"demo\"。"
        + "板子的 device_agent 多半不是发到这个房间，请显式带上 ?room=xxx");
  }
  $("roomLabel").textContent = "房间 " + room;
  return room;
}

/* ------------------------------------------------------------ ICE 配置 */
async function loadIceServers() {
  try {
    const r = await fetch("./ice.json", { cache:"no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    iceServers = (await r.json()).iceServers || [];
    log(iceServers.length
        ? `已取得 ICE 配置（${iceServers.length} 组服务器）`
        : "服务器未下发 ICE 服务器 —— 局域网模式，只用 host candidate");
  } catch (e) {
    // 局域网模式 --ice-mode none 时 /ice.json 仍然存在，只是 iceServers 为空，
    // 所以走到这里通常意味着页面不是从信令服务器加载的。
    log("取 /ice.json 失败（" + e.message + "），按无 STUN/TURN 处理");
  }
}

/* ------------------------------------------------------------ 摄像头切换

   板子上的 device_agent 通过 unix socket 提供一个本地控制端点，web_server
   把它同源代理成 /camera。页面**不直接连 device_agent** —— 那是跨源，
   而且会撞上自签证书在 fetch() 里静默 reject 那个坑（见文件头的说明）。

   清单走独立的 /camera 而不是塞进 /config.json：resolveRoom() 在 URL 带
   ?room= 时会提前 return、根本不 fetch /config.json  —— 塞那儿的话，
   演示时一加 ?room= 按钮就空了。 */
async function loadCameras(quiet) {
  try {
    const r = await fetch("./camera", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const prev = currentCam;
    cams = j.available || [];
    currentCam = j.current || null;
    renderCams();
    // 变了才记账。prev 为 null 是首次加载（页面还不知道原来是谁），不算切换。
    if (prev !== null && currentCam !== prev) noteSourceChanged();
    if (!quiet) {
      log("摄像头：" + cams.map((c) => c.label + (c.present ? "" : "（没插）")).join("、")
          + "，当前 " + currentCam);
    }
  } catch (e) {
    if (!quiet) {
      log("取摄像头列表失败（" + e.message + "）—— 不显示切换按钮。"
          + "板子上 device_agent.py 起了吗？");
    }
  }
}

function renderCams() {
  const box = $("cams");
  // 轮询每 2 秒会调到这里一次。**内容没变就别重建 DOM** —— 重建会丢掉
  // 悬停中的 tooltip，还可能把用户正按下的那一下点掉。
  const sig = JSON.stringify([currentCam, camBusy,
                              cams.map((c) => [c.name, c.label, c.present, c.hint])]);
  if (sig === renderCams.sig) return;
  renderCams.sig = sig;
  box.textContent = "";
  for (const c of cams) {
    const b = document.createElement("button");
    b.textContent = c.label;
    b.className = c.name === currentCam ? "on" : "";
    b.disabled = camBusy || !c.present;
    // 设备节点不在 = 摄像头没插。置灰而不是藏起来：藏起来的话，
    // "为什么少了一个按钮"和"这个功能没做"长得一样。
    b.title = c.present ? (c.hint || "") : `设备 ${c.device} 不存在（摄像头没插好？）`;
    b.addEventListener("click", () => {
      switchCam(c.name).catch((e) => log("switchCam 抛异常: " + e.message));
    });
    box.appendChild(b);
  }
}

async function switchCam(name) {
  if (camBusy || name === currentCam) return;
  camBusy = true;
  markSwitchStart();
  renderCams();
  log(`切换摄像头 → ${name} …`);

  const t0 = performance.now();
  try {
    const r = await fetch("./camera", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.ok) {
      log(`切换失败（HTTP ${r.status}）：${body.error || "服务器没说原因"}`);
    } else if (body.applied) {
      currentCam = body.current;
      log(`已切到 ${currentCam}（板子侧用时 ${Math.round(performance.now() - t0)} ms）。`
          + "不重新协商，画面最多停到下一个关键帧");
    } else {
      // 没有观看端时板子只记住选择，等下一个观看端接入才建管线。
      currentCam = body.current;
      log(`记下了 ${currentCam}；现在没有观看端，等它接入时按这个建流`
          + (body.note ? `（${body.note}）` : ""));
    }
  } catch (e) {
    log("切换请求失败: " + e.message);
  } finally {
    camBusy = false;
    renderCams();
  }
}

/* -------------------------------------------------- 验证用探针（不改行为）

   两个都不用看人眼就能判断"画面真的换了一路"，而且都不受 1Hz 采样地板的
   限制 —— 这个项目在冻结指标上已经吃过一次"采样法少算 2.5 倍"的亏。 */

/* 出帧间隔。用 requestVideoFrameCallback 逐帧记账，所以间隔是**精确的**，
   不是从 1Hz 的样本里反推的。

   "这次切换停顿了多久"是**事后**从最近几秒的间隔里挑最大值算出来的，
   不是在切换那一刻打个标记。理由：打标记只有页面自己发起切换时才打得准，
   而 tools/check_switch.sh 是用 curl 发起的 —— 标记永远打不上，停顿恒为 0，
   "停顿 < 1 秒"就变成一条**自己把自己证明掉**的判据。事后算则不管谁发起的、
   也不管页面晚多久才发现，都算得出来。

   注意：页面被切到后台时浏览器会停掉这个回调，那段时间的空档不是卡顿。 */
const frameGap = {
  last: 0, max: 0, n: 0,
  markT: 0, markMax: 0,   // 正向标记：页面自己发起切换时用
  recent: [],             // 最近几秒每一帧的 [时刻, 间隔]，用来事后算
  stallMs: null,          // 事后回看算出的停顿（别人发起的切换）
};
const STALL_LOOKBACK = 4000;   // 回看多久。要盖住"页面发现得比切换晚"的那段
function onVideoFrame(now) {
  if (frameGap.last) {
    const gap = now - frameGap.last;
    if (gap > frameGap.max) frameGap.max = gap;
    if (frameGap.markT && now >= frameGap.markT && gap > frameGap.markMax) {
      frameGap.markMax = gap;
    }
    frameGap.recent.push([now, gap]);
  }
  frameGap.last = now;
  frameGap.n++;
  const cut = now - STALL_LOOKBACK;
  while (frameGap.recent.length && frameGap.recent[0][0] < cut) frameGap.recent.shift();
  video.requestVideoFrameCallback(onVideoFrame);
}

/* 页面自己发起切换时，在 POST **之前**打一个正向标记：停顿发生在响应之后，
   所以只有往前看才量得到。 */
function markSwitchStart() {
  frameGap.markT = performance.now();
  frameGap.markMax = 0;
}

/* 发现"当前源跟上次看到的不一样"时调一次：回看最近几秒，取最大间隔。
   这就是那一次切换造成的画面停顿 —— 含我们自己的轮询延迟，所以是上界。 */
function noteSourceChanged() {
  const now = performance.now();
  const from = now - STALL_LOOKBACK;
  let worst = 0;
  for (const [t, gap] of frameGap.recent) if (t >= from && gap > worst) worst = gap;
  frameGap.stallMs = Math.round(worst);
  // 回看窗口里如果本来就有一处卡顿，这里会把它的账算到切换头上 ——
  // 偏保守的方向（可能高报），对"停顿 ≤1 秒"这种判据是可接受的。
  log(`发现当前源变了，回看 ${STALL_LOOKBACK / 1000} 秒内最长间隔 `
      + `${frameGap.stallMs} ms（含页面发现的延迟，是上界）`);
}

/* 报出去的停顿：两个来源取大的那个。
   按钮发起 → markMax 有值；curl 发起 → stallMs 有值。两个都没发生过就是 null，
   而不是 0 —— "没测到"和"停顿 0 毫秒"必须能区分开，否则判据会自证通过。 */
function stallMs() {
  const v = Math.max(frameGap.markMax || 0, frameGap.stallMs || 0);
  return v > 0 ? Math.round(v) : null;
}
// 只注册一次。没有媒体时它不回调，有新流进来就继续 —— 所以
// teardownPc / 重连都不用管它。
if (video.requestVideoFrameCallback) {
  video.requestVideoFrameCallback(onVideoFrame);
} else {
  log("这个浏览器不支持 requestVideoFrameCallback，切换停顿的毫秒数测不了");
}

/* 画面采样：亮度均值 + 一张 32×18 的缩略图（每格一个亮度字节，base64）。
   采样只在 postDiag 里做（1Hz），不是每帧都画 —— 那是为了验证，不是功能。
   MediaStream 画到 canvas **不会**污染画布，getImageData 可用。

   为什么要缩略图而不只是均值：**均值会被两个摄像头"恰好一样亮"骗过去**，
   而两路画面是不是同一路，本质上是**逐像素**的问题。有了缩略图，
   验收脚本就能自己给自己定标 —— 拿同一路的前后两帧算一个"噪声底"，
   再拿跨切换的两帧算一个差值，要求后者远大于前者。板子就算撒谎说切了、
   实际还推原来那路，跨切换差值也只等于噪声底，判据当场就红。
   缩略图还能直接打成 ASCII 给人看：换没换，眼睛认一下就知道了。 */
const SAMP_W = 32, SAMP_H = 18;
const sampCanvas = document.createElement("canvas");
sampCanvas.width = SAMP_W; sampCanvas.height = SAMP_H;
const sampCtx = sampCanvas.getContext("2d", { willReadFrequently: true });

function sampleFrame() {
  if (!video.videoWidth) return null;
  try {
    sampCtx.drawImage(video, 0, 0, SAMP_W, SAMP_H);
    const d = sampCtx.getImageData(0, 0, SAMP_W, SAMP_H).data;
    const n = SAMP_W * SAMP_H;
    const lum = new Uint8Array(n);
    let sum = 0;
    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
      const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      lum[p] = y;
      sum += y;
    }
    let bin = "";
    for (let p = 0; p < n; p++) bin += String.fromCharCode(lum[p]);
    return { mean: Math.round((sum / n) * 10) / 10, thumb: btoa(bin) };
  } catch (e) {
    return null;
  }
}

/* -------------------------------------------------------- PeerConnection */
function createPc() {
  pc = new RTCPeerConnection({ iceServers, bundlePolicy:"max-bundle" });

  /* 麦克风音轨必须在**任何 setRemoteDescription 之前**加进来。
     这是踩过的顺序问题：等协商完了再 addTrack，浏览器只会标记"需要重新协商"，
     而本方案是单次 offer、不重协商（见 docs），于是那一路上永远停在 recvonly ——
     症状是"浏览器这边显示在发，板子一点声音都没有"，两边都不报错。
     addTrack（带 track）默认方向就是 sendrecv；下面再显式写一次，
     是因为 addTransceiver 不带 track 时默认是 recvonly，两种 API 容易记混。 */
  if (micStream) {
    const track = micStream.getAudioTracks()[0];
    if (track) {
      pc.addTrack(track, micStream);
      const tx = pc.getTransceivers().slice(-1)[0];
      if (tx) {
        try { tx.direction = "sendrecv"; }
        catch (e) { log("设 transceiver.direction 失败: " + e.message); }
      }
      log(`已把麦克风音轨加进 PeerConnection（track=${track.label}，`
          + `方向=${tx ? tx.direction : "?"}）`);
    }
  }

  pc.ontrack = (ev) => {
    log(`ontrack: kind=${ev.track.kind}`);
    if (ev.streams && ev.streams[0]) {
      video.srcObject = ev.streams[0];
    } else {
      // webrtcbin 的 msid 形如 userXXX@host-yyy，浏览器有时不把它塞进
      // ev.streams，这时必须手动挂 track，否则 srcObject 一直是 null —— 黑屏。
      if (!video.srcObject) video.srcObject = new MediaStream();
      video.srcObject.addTrack(ev.track);
    }
    video.play().catch((e) => log("video.play() 被拒绝: " + e.message));
    startStats();
  };

  pc.onicecandidate = (ev) => {
    if (ev.candidate) {
      send({ type:"candidate", candidate:ev.candidate.candidate,
             sdpMLineIndex:ev.candidate.sdpMLineIndex });
    }
  };

  // 打洞失败时这里给出错误码和地址，是排查防火墙最直接的线索。
  pc.onicecandidateerror = (ev) => {
    log(`ICE 候选错误: code=${ev.errorCode} "${ev.errorText}" ` +
        `url=${ev.url || "?"} ${ev.address || "?"}:${ev.port || "?"}`);
  };

  pc.oniceconnectionstatechange = () => {
    if (!pc) return;
    log("iceConnectionState = " + pc.iceConnectionState);
    // 注意：这个值报 connected **不代表有媒体**。板子实测遇到过
    // iceConnectionState=connected 而画面全黑的情况。真正算数的是
    // 候选对的字节有没有在涨 —— 见下面的 getStats。
  };

  pc.onconnectionstatechange = () => {
    if (!pc) return;
    log("connectionState = " + pc.connectionState);
    if (pc.connectionState === "connected") {
      setStatus("已连接", "ok");
      dumpIce().catch(() => {});
    } else if (pc.connectionState === "failed") {
      setStatus("连接失败", "err");
    }
  };
}

function teardownPc() {
  stopStats();
  if (pc) { pc.close(); pc = null; }
  pendingCandidates.length = 0;
  prevSample = null;
  lastStats = null;
  statsEl.textContent = "等待发布端…";
}

/* 把板子 offer 里的 m-line 和方向打出来。

   阶段二最想确认的一件事就是音频那一路协商成了什么方向，而这三个值在浏览器里
   **都不报错**，只有这一行 SDP 说得清：
     sendrecv  双向都通
     sendonly  板子只发 → 听得到板子，板子听不到你
     recvonly  板子只收 → 板子听得到你，你听不到板子
   （旧项目就踩过 addTransceiver 协商成 recvonly 的坑。） */
function logOfferMedia(sdp) {
  const lines = (sdp || "").split(/\r?\n/).map((l) => l.trim());
  const mIdx = [];
  lines.forEach((l, i) => { if (l.startsWith("m=")) mIdx.push(i); });
  if (!mIdx.length) { log("!! offer 里没有 m= 行，SDP 可能没解析出来"); return; }

  mIdx.forEach((start, k) => {
    const end = (k + 1 < mIdx.length) ? mIdx[k + 1] : lines.length;
    let dir = "（未写，默认 sendrecv）";
    for (let j = start + 1; j < end; j++) {
      const v = lines[j].match(/^a=(sendrecv|sendonly|recvonly|inactive)$/);
      if (v) { dir = v[1]; break; }
    }
    log(`  offer m-line[${k}] ${lines[start]}  方向=${dir}`);
  });

  log(lines.some((l) => /^a=rtpmap:\d+ opus\/48000/i.test(l))
      ? "  offer 里有 opus/48000 —— 板子那路麦克风已经在推了"
      : "  !! offer 里没有 opus/48000：板子侧音频分支没建起来。"
        + "去看它的启动日志，多半是 AudioUnavailable 或者用了 --no-audio");
}

/* ------------------------------------------------------------ 连接流程 */
async function connect() {
  if (pc) return;
  await resolveRoom();
  await loadIceServers();
  createPc();

  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const url = `${proto}//${location.host}/ws/view?room=${encodeURIComponent(room)}`;
  ws = new WebSocket(url);

  ws.onopen = () => { log("信令已连接"); setStatus("等待发布端…", "warn"); };

  ws.onerror = () => log("信令 WebSocket 出错");

  ws.onclose = () => { log("信令已断开"); teardownPc(); setStatus("已断开", "err"); };

  ws.onmessage = async (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); }
    catch { log("非 JSON 消息: " + String(ev.data).slice(0,120)); return; }

    try {
      switch (msg.type) {
        case "offer": {
          // 发布端重连后会发来全新的 offer，而一个 pc 不能重复协商，必须重建。
          if (!pc) { log("收到新 offer，重建 PeerConnection…"); createPc(); }
          log("收到 offer，创建 answer…");
          logOfferMedia(msg.sdp);
          await pc.setRemoteDescription({ type:"offer", sdp:msg.sdp });
          await drainPendingCandidates();
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          send({ type:"answer", sdp:pc.localDescription.sdp });
          log("answer 已发送");
          break;
        }
        case "candidate": {
          if (!msg.candidate) break;
          const init = { candidate:msg.candidate, sdpMLineIndex:msg.sdpMLineIndex };
          // 候选常常比 offer 先到（发布端是 trickle 发的），pc 或远端描述还没
          // 就绪时先缓存，等 setRemoteDescription 之后再补进去。
          if (!pc || !pc.remoteDescription) { pendingCandidates.push(init); break; }
          await pc.addIceCandidate(init)
            .catch((e) => log("addIceCandidate 失败: " + e.message));
          break;
        }
        case "waiting":
          log("服务器: " + (msg.message || "发布端还没连上"));
          setStatus("等待发布端…", "warn");
          break;
        case "publisher-gone":
          // 发布端掉线。信令连接保持不动 —— 它重连后服务器会重新配对，
          // 届时会再来一个全新 offer，所以这里只拆 pc、不关 ws。
          log("发布端已断开，等它重连…");
          setStatus("发布端已断开", "err");
          teardownPc();
          break;
        case "error":
          log("服务器错误: " + msg.message);
          setStatus("服务器错误", "err");
          break;
        default:
          log("未知消息: " + msg.type);
      }
    } catch (err) {
      log("处理 " + msg.type + " 失败: " + err.message);
    }
  };
}

async function drainPendingCandidates() {
  while (pendingCandidates.length) {
    const c = pendingCandidates.shift();
    await pc.addIceCandidate(c).catch((e) => log("缓存候选入队失败: " + e.message));
  }
}

/* ---------------------------------------------------------------- 统计 */
function startStats() {
  if (statsTimer) return;
  statsTimer = setInterval(collectStats, 1000);
  // 诊断上报频率比界面刷新低：样本要留在服务器上供 analyze_diag.py 分析，
  // 2 秒一条足够刻画稳态，也不会把服务器内存刷爆。
  // 诊断上报必须和 collectStats 同频（1s），不能更慢。
  // "最长冻结"那条判据的分辨率就是这里：按 2 秒上报时，一次 1.5 秒的卡顿
  // 可能恰好被两个采样点跨过去，完全看不见；量出来的也只能是 2 秒的整数倍。
  // 服务器侧 _diag 是 maxlen=2000 的 deque，两端各 1Hz 还有约 16 分钟历史，
  // 对一次验证来说绰绰有余。
  diagTimer = setInterval(postDiag, 1000);
}

function stopStats() {
  if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
  if (diagTimer) { clearInterval(diagTimer); diagTimer = null; }
}

/* 候选端点摘要。判据里最想知道的一件事是"媒体到底直连还是走 TURN 中继"：
   走中继就意味着绕公网一圈，突发丢包和随之而来的解码冻结都从这里来，
   而 getStats 的字节数无论走哪条路都长得一样，看不出来。 */
function candBrief(c) {
  if (!c) return null;
  return {
    type: c.candidateType,          // host / srflx / prflx / relay
    protocol: c.protocol,           // udp / tcp
    address: c.address || c.ip,
    port: c.port,
    relayProtocol: c.relayProtocol, // 只在中继候选上有
  };
}

async function collectStats() {
  if (!pc || pc.connectionState !== "connected") return;
  const report = await pc.getStats();

  let inbound = null, transport = null;
  // 音频单独取。**不能拿视频的数字给音频背书** —— 两路的失败方式完全独立
  // （一个坏在摄像头/编码器，一个坏在 ALSA 设备名），一起算就分不出来了。
  let audioIn = null, audioOut = null;
  const pairs = [];
  report.forEach((r) => {
    if (r.type === "inbound-rtp" && r.kind === "video") inbound = r;
    if (r.type === "inbound-rtp" && r.kind === "audio") audioIn = r;
    if (r.type === "outbound-rtp" && r.kind === "audio") audioOut = r;
    if (r.type === "transport" && transport === null) transport = r;
    if (r.type === "candidate-pair") pairs.push(r);
  });

  /* 候选对：主路走 transport.selectedCandidatePairId —— 这是"当前真正在用
     的那一对"。不能只遍历 candidate-pair 挑 nominated 的那个：ICE 重启后
     旧候选对的 nominated 标志还挂着，而它的字节是**冻住的**，拿它算速率会
     得出一路 0，看起来像"媒体断了"，其实连接好好的。

     但实测（349 条样本，0 条拿到）transport 这条路在某些浏览器/版本上取不到
     东西，于是退回到"nominated 且 succeeded 且已收字节最多"的那一对。
     退路**可能挑中冻住的旧对**，所以把走了哪条路一并上报：
     判据那边仍然要求字节确实在增长，挑错了照样过不了，不会被悄悄放过。 */
  let pair = null, pairSource = null;
  if (transport && transport.selectedCandidatePairId) {
    pair = report.get(transport.selectedCandidatePairId) || null;
    if (pair) pairSource = "transport";
  }
  if (!pair && pairs.length) {
    const live = pairs.filter((p) => p.nominated && p.state === "succeeded");
    const pool = live.length ? live : pairs;
    pair = pool.reduce((a, b) =>
      (b.bytesReceived || 0) > (a.bytesReceived || 0) ? b : a);
    pairSource = `fallback(${live.length ? "nominated" : "all"}/${pairs.length}对)`;
  }

  if (!inbound) { statsEl.textContent = "尚未收到视频流…"; return; }

  const now = inbound.timestamp;
  let fps = "—", kbps = "—", pairRate = "—", aInKbps = "—", aOutKbps = "—";
  if (prevSample && now > prevSample.timestamp) {
    const dt = (now - prevSample.timestamp) / 1000;
    fps = ((inbound.framesDecoded - prevSample.framesDecoded) / dt).toFixed(1);
    kbps = (((inbound.bytesReceived - prevSample.bytesReceived) * 8) / dt / 1000)
             .toFixed(0);
    if (pair && prevSample.pairBytes != null) {
      pairRate = (((pair.bytesReceived - prevSample.pairBytes) / dt) / 1024)
                   .toFixed(0) + " KiB/s";
    }
    // 音频速率是**双向**的两个数，且都按 kbps 保留一位 —— Opus 32kbps 的量级
    // 用整数就没分辨率了，看不出"从 32 掉到 3"这种（那正是断流的信号）。
    if (audioIn && prevSample.audioInBytes != null) {
      aInKbps = (((audioIn.bytesReceived - prevSample.audioInBytes) * 8) / dt / 1000)
                  .toFixed(1);
    }
    if (audioOut && prevSample.audioOutBytes != null) {
      aOutKbps = (((audioOut.bytesSent - prevSample.audioOutBytes) * 8) / dt / 1000)
                   .toFixed(1);
    }
  }
  prevSample = {
    timestamp: now,
    framesDecoded: inbound.framesDecoded,
    bytesReceived: inbound.bytesReceived,
    pairBytes: pair ? pair.bytesReceived : null,
    audioInBytes: audioIn ? audioIn.bytesReceived : null,
    audioOutBytes: audioOut ? audioOut.bytesSent : null,
  };

  // 三态要说清，不能都显示成 0：这一路**根本不存在**（没协商上）、
  // 存在但没数据（协商了没人发）、和在正常发，是三件要查不同地方的事。
  const aLine = (r, unit) => !r ? "（这一路不存在）"
      : `${unit === "in" ? aInKbps : aOutKbps} kbps  `
        + `累计 ${((unit === "in" ? r.bytesReceived : r.bytesSent) / 1024).toFixed(0)} KiB`
        + (unit === "in" ? `  丢包 ${r.packetsLost || 0}` : "");

  statsEl.textContent =
    `分辨率      ${inbound.frameWidth || "?"} x ${inbound.frameHeight || "?"}\n` +
    `帧率        ${fps} fps  (累计 ${inbound.framesDecoded} 帧)\n` +
    `码率        ${kbps} kbps\n` +
    `已接收      ${(inbound.bytesReceived / 1048576).toFixed(2)} MiB\n` +
    `丢包        ${inbound.packetsLost || 0}\n` +
    `抖动        ${inbound.jitter != null ? (inbound.jitter*1000).toFixed(1)+" ms" : "—"}\n` +
    `候选对速率  ${pairRate}\n` +
    `播放位置    ${video.currentTime.toFixed(1)} s\n` +
    `连接状态    ${pc.connectionState} / ICE ${pc.iceConnectionState}\n` +
    `—— 音频 ——\n` +
    `板→浏览器   ${aLine(audioIn, "in")}\n` +
    `浏览器→板   ${aLine(audioOut, "out")}\n` +
    `浏览器麦克风 ${micStream ? "已开" : "未开（点「开始对讲」）"}`;

  // 板子发来的 offer 就在 remoteDescription 里 —— 它才是"板子愿意给什么"的
  // 权威来源。看 nackCount=0 只能知道"浏览器没发过重传请求"，说明不了
  // "是没协商上还是不需要"；那要翻这里的 a=rtcp-fb 和 a=rtx。
  // 支持重传需要三样同时在：a=rtcp-fb:<pt> nack、a=rtx:<pt2>、a=fmtp:<pt2> apt=<pt>。
  function negSummary() {
    const sdp = pc.remoteDescription && pc.remoteDescription.sdp;
    if (!sdp) return null;
    const mlines = [], rtcpFb = [];
    let rtxLines = 0, aptLines = 0, rtcpMux = false;
    for (const raw of sdp.split(/\r?\n/)) {
      const line = raw.trim();
      if (line.startsWith("m=")) mlines.push(line);
      else if (line.startsWith("a=rtcp-fb:")) rtcpFb.push(line);
      else if (line.startsWith("a=rtx:")) rtxLines++;
      else if (line.includes("apt=")) aptLines++;
      else if (line.startsWith("a=rtcp-mux")) rtcpMux = true;
    }
    return { mlines, rtcpFb, rtxLines, aptLines, rtcpMux };
  }

  // 这份样本还要上报给服务器，多存一份免得 postDiag 里再算一遍。
  lastStats = {
    pageVersion: PAGE_VERSION,
    browser: navigator.userAgent,
    negotiation: negSummary(),
    video: {
      bytesReceived: inbound.bytesReceived,
      packetsReceived: inbound.packetsReceived,
      packetsLost: inbound.packetsLost || 0,
      framesDecoded: inbound.framesDecoded,
      frameWidth: inbound.frameWidth,
      frameHeight: inbound.frameHeight,
      fps: fps === "—" ? null : Number(fps),
      kbps: kbps === "—" ? null : Number(kbps),
      jitter: inbound.jitter,

      // 下面这几个是**浏览器自己记的账**，比我按采样间隔反推可靠。
      //
      // freezeCount / totalFreezesDuration：Chrome 有，用于跨过采样间隔抓短卡顿。
      // **Firefox 不实现这两个字段**（取回来是 undefined，不是字段名写错）。
      // 所以冻结统计的主力仍是"相邻样本帧增量是否为 0"，分辨率被上报频率卡在
      // 1 秒 —— 短于约 1 秒的卡顿这个方法看不见。Chrome 在的时候用 freezeCount
      // 当权威值，Firefox 在的时候只能认那个 1 秒地板。
      //
      // keyFramesDecoded：累计解出的关键帧数。这是判断"按需关键帧到底有没有发生"
      // 的**直接**证据 —— gop=60 在 20fps 下 IDR 应该每 3 秒来一个，如果实测间隔
      // 明显短于 3 秒，那只可能是有人请求了。配合 pliCount 就能把链路两半分开：
      // pliCount 涨了而 keyFramesDecoded 仍是 3 秒一格 => 板子收到 PLI 不响应。
      //
      // pliCount：板子 offer 里 a=rtcp-fb:102 nack pli 是有的，所以 PLI 协商通过。
      // 实测 Firefox 全程 0，Chrome 会发 —— 同一套板子代码，差别在浏览器。
      //
      // nackCount 恒为 0，且**不是**因为丢包不够：板子 offer 里声明了 nack，
      // 却没有 a=rtx / apt= 行，没有 RTX 载荷类型。按 RFC 4588 重传必须走
      // 独立 PT，接收端拿不到 PT 就用不了 NACK，所以重传根本不可能发生。
      // 这是 webrtcbin 1.20.3 的能力上限，不是配置错。Chrome 和 Firefox 都是 0。
      //
      // jitterBufferDelay / jitterBufferEmittedCount：两个一除就是帧在抖动缓冲里
      // 平均等了多久。如果冻结的主因是等关键帧，这个值应该很小；如果它很大，
      // 那冻结是缓冲策略造成的，是另一个（更好修的）故事。
      framesReceived: inbound.framesReceived,
      framesDropped: inbound.framesDropped,
      freezeCount: inbound.freezeCount,
      totalFreezesDuration: inbound.totalFreezesDuration,
      pliCount: inbound.pliCount,
      nackCount: inbound.nackCount,
      firCount: inbound.firCount,
      keyFramesDecoded: inbound.keyFramesDecoded,
      framesPerSecond: inbound.framesPerSecond,
      jitterBufferDelay: inbound.jitterBufferDelay,
      jitterBufferEmittedCount: inbound.jitterBufferEmittedCount,
    },
    // 音频这两个方向分开报。**"进"通了不代表"出"通了** ——
    // "出"那一路（浏览器的麦克风）是最容易单向半通的一段：轨没在
    // setRemoteDescription 之前加进去时，浏览器这边照样显示"在发"，
    // 但板子上一个 opus 帧都解不出来。判据必须两边对得上才算过。
    audio: {
      inBytesReceived: audioIn ? audioIn.bytesReceived : null,
      inPacketsReceived: audioIn ? audioIn.packetsReceived : null,
      inPacketsLost: audioIn ? (audioIn.packetsLost || 0) : null,
      inKbps: aInKbps === "—" ? null : Number(aInKbps),
      // totalAudioEnergy 是"真有声音"而不是"真有包"的区分依据：
      // 板子 3.5mm 口插的是三极耳机时，那一路上会稳定地流着本底噪声，
      // 包和字节都正常增长，只有能量接近于 0。Chrome 有，Firefox 不实现。
      inTotalAudioEnergy: audioIn ? audioIn.totalAudioEnergy : undefined,
      outBytesSent: audioOut ? audioOut.bytesSent : null,
      outPacketsSent: audioOut ? audioOut.packetsSent : null,
      outKbps: aOutKbps === "—" ? null : Number(aOutKbps),
      hasMicTrack: !!(micStream && micStream.getAudioTracks().length),
    },
    selectedPair: pair ? {
      id: pair.id,
      state: pair.state,
      nominated: !!pair.nominated,
      bytesSent: pair.bytesSent,
      bytesReceived: pair.bytesReceived,
      currentRoundTripTime: pair.currentRoundTripTime,
      localCandidateId: pair.localCandidateId,
      remoteCandidateId: pair.remoteCandidateId,
    } : null,
    pairSource: pairSource,
    pairLocal: pair ? candBrief(report.get(pair.localCandidateId)) : null,
    pairRemote: pair ? candBrief(report.get(pair.remoteCandidateId)) : null,
    // 原始 transport 统计照原样带回去。主路取不到东西时，光看"结果是 null"
    // 猜不出是浏览器没给这条统计、还是给了但没有 selectedCandidatePairId ——
    // 这两种要改的地方完全不同。带上原始对象就不用再猜一轮。
    transports: transport ? Object.assign({}, transport) : null,
    candidatePairCount: pairs.length,
    srcTime: video.currentTime,
  };
}

/* ------------------------------------------------------------ 诊断上报

   无头验证的唯一通道：浏览器里的人眼看不到东西，console.log 在强杀进程时
   也拿不到，只能让页面自己把 getStats() 摘要送回服务器，事后慢慢分析。 */
async function postDiag() {
  if (!lastStats || !pc) return;
  // 采一次就够，均值和缩略图出自同一帧 —— 分两次 drawImage 的话两者可能
  // 来自不同的帧，跨切换比对时就会多出一份对不上的抖动。
  const samp = sampleFrame();
  try {
    await fetch("./diag", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        role: "browser",
        room,
        ts: Date.now() / 1000,
        connectionState: pc.connectionState,
        iceConnectionState: pc.iceConnectionState,
        // 摄像头这一组：current 是**板子**说的当前源（页面只是转述，不自己记），
        // meanY 是画面亮度均值，thumb 是 32×18 的亮度缩略图（base64），
        // gapMaxMs 是建会话以来最长的两帧间隔，
        // gapSinceSwitchMs 是最近一次切换造成的停顿。后两个都按帧记账，
        // 没有 1 秒采样地板。
        camera: {
          current: currentCam,
          count: cams.length,
          meanY: samp ? samp.mean : null,
          thumb: samp ? samp.thumb : null,
          gapMaxMs: frameGap.max ? Math.round(frameGap.max) : null,
          gapSinceSwitchMs: stallMs(),
          framesSeen: frameGap.n,
        },
        ...lastStats,
      }),
    });
  } catch (e) { /* 上报失败不影响观看，静默 */ }
}

/* ------------------------------------------------------------ ICE 详情 */
async function dumpIce() {
  if (!pc) return;
  const report = await pc.getStats();
  const byId = {};
  const locals = [], remotes = [], pairs = [];
  report.forEach((r) => {
    byId[r.id] = r;
    if (r.type === "local-candidate") locals.push(r);
    else if (r.type === "remote-candidate") remotes.push(r);
    else if (r.type === "candidate-pair") pairs.push(r);
  });

  const cand = (c) => {
    const addr = c.address || c.ip || "?";
    let s = `${(c.candidateType||"?").padEnd(6)} ${(c.protocol||"?").toUpperCase().padEnd(4)} ` +
            `${addr}:${c.port}`;
    // 浏览器会把 host candidate 混淆成随机的 .local 名（Chrome、Firefox 都
    // 这么做）。板子那侧要靠 avahi + libnss-mdns 才解析得了，缺一个就是
    // "连上了但零媒体"。
    if (/\.local$/i.test(addr)) s += "   <- mDNS 混淆地址";
    return s;
  };
  const list = (arr) => arr.length ? arr.map((c) => "  " + cand(c)).join("\n") : "  （无）";

  const srv = iceServers.length
    ? iceServers.map((s) => (s.urls||[]).join(" / ")).join(" ; ")
    : "无（局域网，只用 host candidate）";

  let out = `ICE 服务器  ${srv}\n\n`;
  out += `本地候选 (local) — ${locals.length} 个\n${list(locals)}\n\n`;
  out += `远端候选 (remote) — ${remotes.length} 个\n${list(remotes)}\n\n`;
  out += `候选对 (candidate pairs) — ${pairs.length} 对\n`;
  if (!pairs.length) out += "  （无）\n";
  pairs.forEach((p) => {
    const l = byId[p.localCandidateId] || {}, r = byId[p.remoteCandidateId] || {};
    out += `${p.nominated ? "  ★" : "   "} state=${p.state} nominated=${!!p.nominated}`;
    if (p.currentRoundTripTime != null) {
      out += `  rtt=${(p.currentRoundTripTime*1000).toFixed(1)}ms`;
    }
    out += `\n      本端 ${l.address||l.ip||"?"}:${l.port} (${l.candidateType||"?"})` +
           `  <->  远端 ${r.address||r.ip||"?"}:${r.port} (${r.candidateType||"?"})\n`;
    out += `      已发 ${p.bytesSent||0} B / 已收 ${p.bytesReceived||0} B\n`;
  });
  out += `\n要逐条的 ICE 事件流和完整 SDP，开 chrome://webrtc-internals。`;
  iceEl.textContent = out;
}

/* ------------------------------------------------------------ 对讲（阶段二）

   浏览器 → 板子 这一路要拿麦克风，而 getUserMedia 只在**安全上下文**里存在。
   非安全上下文（http://192.168.x.x）下 navigator.mediaDevices 直接是
   **undefined** —— 不是抛异常，是压根没有这个对象。所以下面对它显式检查并说清
   原因，而不是等它 TypeError 出来一句"cannot read property of undefined"。
   表现极具迷惑性：视频一切正常，麦克风永远拿不到。

   另外那个按钮的点击手势还兼职解除视频静音：自动播放策略要求"带声音的播放"
   必须由用户手势触发，所以 <video> 一开始只能是 muted（见页面里那段注释）。 */
async function startTalk() {
  const btn = $("talkBtn"), hint = $("talkHint");

  if (micStream) {                       // 再点一次 = 挂断
    micStream.getTracks().forEach((t) => t.stop());
    micStream = null;
    btn.classList.remove("on");
    btn.textContent = "开始对讲";
    hint.textContent = "已停止。再点一次重新申请麦克风";
    log("已释放麦克风，重连以撤掉音轨…");
    reconnect();
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    hint.textContent = "当前页面不是安全上下文，拿不到麦克风";
    log("!! navigator.mediaDevices 不存在。getUserMedia 只在 https（或 "
        + "localhost）下可用，当前是 " + location.protocol + "//" + location.host
        + "。请改用板子的 https 地址打开（见 tools/run-web.sh），"
        + "并接受一次自签证书的警告。视频不受影响，只有对讲需要。");
    return;
  }

  btn.disabled = true;
  hint.textContent = "正在申请麦克风…";
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        // 主要回声在浏览器这一侧，由这里的 AEC 处理就够了 ——
        // 板子接的是耳麦，扬声器那点声漏回麦克风的量很小，所以板端
        // **不挂 webrtcdsp**（原因见 docs/architecture.md）。
        // 哪天把板子改成外放音箱，就得把 webrtcdsp 加回板端。
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      },
    });
  } catch (e) {
    btn.disabled = false;
    hint.textContent = "麦克风申请失败：" + e.name;
    // NotAllowedError 可能真是用户点了拒绝，也可能是页面不在安全上下文 ——
    // Chrome 对后者的报错也是这个名字，所以别一口咬定是用户拒绝。
    log(`getUserMedia 失败: ${e.name} ${e.message}`
        + (e.name === "NotAllowedError"
           ? "（可能是用户拒绝，也可能是页面不在安全上下文里）" : ""));
    return;
  }

  const track = micStream.getAudioTracks()[0];
  log(`拿到麦克风: ${track ? track.label : "?"}`);
  // 这个手势同时解除静音。单独一行是因为它和音轨是两件事：
  // 少了它，板子那边一路正常推流，你这边只有画面没有声音。
  video.muted = false;
  log("视频已解除静音 —— 板子麦克风的声音从这里出来");

  btn.disabled = false;
  btn.classList.add("on");
  btn.textContent = "停止对讲";
  hint.textContent = "对讲中：板子能听见你，你能听见板子";

  // **必须重连**，不能就地 addTrack。板子是单次 offer、不重协商（整个简化
  // 方案就建在这上面），而这个 pc 早协商完了。重连走一遍完整的 offer/answer，
  // 新 offer 和我们的 answer 里自然就带上音频那一路。
  log("重连以把麦克风音轨带进这次协商…");
  reconnect();
}

/* 拆掉当前会话再连一次。
   ws.onclose 本来也会 teardownPc，但这里显式做一遍，不依赖回调时序；
   而关旧的 ws 之前先摘掉 onclose，否则它会再触发一次 setStatus("已断开")，
   界面上闪一下"已断开"再回到"重连中"，看起来像出错了。 */
function reconnect() {
  const old = ws;
  ws = null;
  if (old) {
    old.onclose = null;
    try { old.close(); } catch (e) { /* 已经关了就算了 */ }
  }
  teardownPc();
  setStatus("重连中…", "warn");
  connect();
}

/* ---------------------------------------------------------------- 启动 */
window.addEventListener("beforeunload", () => send({ type:"bye" }));

// 按钮在这里挂，不是在 startTalk 里自己挂自己 —— 一个函数不该顺便管接线。
$("talkBtn").addEventListener("click", () => {
  startTalk().catch((e) => log("startTalk 抛异常: " + e.message));
});

log(`页面来自 ${location.host}，自动连接…`);
// 提前说一句，免得用户以为对讲坏了。这里只提示，不阻止连接 ——
// 视频在 http 下完全正常。
if (!window.isSecureContext) {
  log("注意：当前不是安全上下文（" + location.protocol + "），浏览器不会给麦克风，"
      + "对讲用不了。用板子的 https 地址打开就有。视频不受影响。");
}
// 和 connect() 并列，**不挂进 resolveRoom()** —— 那个函数在 URL 带 ?room=
// 时会提前 return，把按钮的加载绑上去就等于"加了 ?room= 按钮就没了"。
// 也不 await：清单晚一点到不影响看画面。
loadCameras();
connect();

/* 之后每 2 秒再问一次，因为**当前是哪一路以板子为准**（见上面 currentCam 的
   注释），而板子那边的源可能不是这个页面切的 —— 比如 tools/check_switch.sh
   直接用 curl 发 POST。不轮询的话按钮会一直停在旧的高亮上，页面就成了
   "自己记着"而不是"听板子的"。
   轮询也顺手让 present 保持新鲜：摄像头拔了按钮就置灰。
   quiet=true：没变化时不往日志区刷，否则 2 秒一条会把它淹掉。 */
setInterval(() => { loadCameras(true); }, 2000);
</script>
